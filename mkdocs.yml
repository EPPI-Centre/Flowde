site_name: flowde
site_url: https://eppi-centre.github.io/Flowde/
site_description: >
  Extract, classify, rotate and parse flowcharts, with worked CONSORT examples
  and benchmarks against ground truth.
repo_url: https://github.com/EPPI-Centre/Flowde
repo_name: GitHub
edit_uri: edit/main/docs/
strict: true

watch:
  - src

exclude_docs: |
  /AGENTS.md

theme:
  name: readthedocs
  prev_next_buttons_location: none

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members: false
            heading_level: 3

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-code.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - User Guide:
      - Installation: installation.md
      - Core pipeline:
          - Overview: pipeline/index.md
          - Setup default pipeline functions: pipeline/setup-default-funcs.md
          - Image extraction: pipeline/image-extraction.md
          - Image classification: pipeline/classification.md
          - Image rotation: pipeline/rotation.md
          - Flowchart parsing: pipeline/parsing.md
          - Stopping and resuming: pipeline/resuming.md
          - Tokens and costs: pipeline/usage.md
          - Few-shot examples: pipeline/few-shot.md
      - Custom functions: pipeline/custom-functions.md
      - Benchmarking:
          - Classification: benchmarking/classification.md
          - Rotation: benchmarking/rotation.md
          - Parsing: benchmarking/parsing.md
      - Recipes:
          - Overview: recipes/index.md
          - End-to-end:
              - CONSORT: recipes/consort.md
  - API Reference:
      - Overview: reference/index.md
      - Pipeline functions: reference/pipeline.md
      - Function factories and helpers: reference/helpers.md
      - Data types: reference/data-types.md
      - Benchmarks: reference/benchmarks.md
