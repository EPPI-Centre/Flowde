name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            .github
            src
            tests
            badges

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv sync --all-extras --group test

      - name: Run tests
        run: >
          uv run python
          -m pytest
          --cov-report=json

      # TODO: Change this back to the default branch condition later.
      - name: Update Coverage Badge
        if: >
          github.ref == format(
            'refs/heads/{0}',
            github.event.repository.default_branch
          ) &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.13'
        uses: we-cli/coverage-badge-action@main
