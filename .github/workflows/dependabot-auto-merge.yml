---
name: Dependabot auto-merge

# Run the trusted workflow from main, without checking out or running PR code.
"on":
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.repository == 'EPPI-Centre/Flowde' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # All update types are eligible; main's required checks gate the merge.
      # Built-in token merges intentionally do not trigger push workflows.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Refuse this request if the PR has changed since the event.
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
