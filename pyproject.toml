[build-system]
build-backend = "setuptools.build_meta"
# TODO: Come back to setuptools-scm
# requires = ["setuptools", "setuptools-scm"]
requires = ["setuptools>=84.2.1"]

[dependency-groups]
docs = [
    "mkdocs-git-revision-date-localized-plugin>=1.6.2",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
    "ruff>=0.17.3"
]
test = [
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pyte>=0.8.2",
    "pytest-cov>=7.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "toml-sort>=0.25.0",
    "tox>=4.67.4",
    "virtualenv>=21.15.1"
]

[project]
authors = [
    { name = "Sam Molyneux" }
]
dependencies = [
    "certifi>=2026.10.23",
    "cloudpickle>=3.1.2",
    "joblib>=1.6.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1"
]
description = "Extracting data from CONSORT flowcharts."
# dynamic = ["version"]
name = "flowde"
readme = "README.md"
requires-python = ">=3.12.16"
version = "0.0.0"

[project.optional-dependencies]
all = [
    "google-genai>=2.34.0",
    "hf-xet>=1.7.1",
    "levenshtein>=0.27.5",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.2.2,!=3.3.0,!=3.3.1; sys_platform != 'darwin'",
    "paddlepaddle>=3.3.1; sys_platform == 'darwin'",
    "scipy>=1.18.1"
]
benchmark = [
    "levenshtein>=0.27.5",
    "numpy>=2.5.4",
    "scipy>=1.18.1"
]
gemini = [
    "google-genai>=2.34.0"
]
openai = [
    "openai>=3.41.0"
]
paddle = [
    "hf-xet>=1.7.1",
    "paddleocr>=3.7.0"
]

[tool.coverage.report]
exclude_also = ['\A(?s:.*# pragma: exclude file.*)\Z']
omit = ["*/flowde/prompts/*"]

[tool.mypy]
disable_error_code = [
    'import-untyped',
    'no-any-return'
]
enable_error_code = ["ignore-without-code"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict",
    "-m",
    "not integration",
    "--cov=flowde",
    "--cov-report=term-missing"
]
filterwarnings = [
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:No ccache found.*:UserWarning"
]
markers = [
    "integration: tests that call external services or require real API credentials"
]
pythonpath = ["src"]
testpaths = ["tests"]
verbosity_test_cases = "2"

[tool.ruff]
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
    "ANN002",  # Args needs type hint
    "ANN003",  # Kwargs needs type hint
    "ANN401",  # Disallow `Any` in annotations.
    "C901",  # Function too complex (McCabe).
    "COM812",  # Missing trailing comma (multi-line).
    "CPY001",  # Missing copyright notice.
    "D100",  # Missing docstring in public module.
    "D101",  # Missing docstring in public class.
    "D102",  # Missing docstring in public method.
    "D103",  # Missing docstring in public function.
    "D104",  # Missing docstring in public package.
    "D105",  # Missing docstring in magic method.
    "D107",  # Missing docstring in __init__
    "D203",  # Blank line before class docstring.
    "D212",  # Multi-line docstring summary on first line.
    "FBT001",  # Boolean positional arg in definition.
    "FBT002",  # Boolean default for positional arg.
    "FIX002",  # Line contains todo
    "N803",  # Argument name not snake_case.
    "N806",  # Non-lowercase variable in function.
    "PGH004",  # use specific rule codes with noqa
    "PLR0912",  # Too many branches.
    "PLR0913",  # Too many arguments.
    "PLR0915",  # Too many statements.
    "PLR0917",  # Existing public APIs accept positional arguments.
    "RET504",  # Unnecessary assign before return.
    "S106",  # Hardcoded password in call.
    "S311",  # Weak cryptographic random number generator.
    "T201",  # `print` found.
    "T203",  # `pprint` found.
    "TD002",  # Missing author in todo
    "TD003"  # Missing issue link in todo
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["ERA001", "INP001"]
"tests/**/*.py" = [
    "ANN",  # Type annotations are not required in tests.
    "ARG001",  # Fixture arguments can be used only for their setup side effects.
    "ARG005",  # Test doubles may need unused arguments to match a callable signature.
    "PLR0917",  # Parametrized tests can require many fixtures and case values.
    "PLR2004",  # Literal expected values make test assertions clearer.
    "S101",  # Plain assert statements are how pytest performs checks.
    "SLF001"  # Tests may need to exercise or reset private implementation details.
]

[tool.tomlsort]
all = true
ignore_case = true
in_place = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.pytest.ini_options.addopts".inline_arrays = false
overrides."tool.pytest.ini_options.filterwarnings".inline_arrays = false
overrides."tool.tox.env_run_base.commands".inline_arrays = false
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4

[tool.tox]
env_list = ["py312", "py313"]
requires = ["tox>=4.67.4"]

[tool.tox.env_run_base]
commands = [
    ["python", "-m", "pytest", "{posargs:tests}"]
]
dependency_groups = ["test"]
description = "Run pytest under {base_python}"
extras = ["benchmark", "gemini", "openai", "paddle"]
package = "wheel"

[tool.uv]
required-version = ">=0.13.6"
